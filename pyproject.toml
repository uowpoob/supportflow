[project]
name = "supportflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "uowpoob", email = "li754692@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.13",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymysql[rsa]>=1.2.0",
    "sqlalchemy>=2.0.53",
    "uvicorn>=0.52.4",
]

[project.scripts]
supportflow = "supportflow:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
