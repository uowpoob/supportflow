[project]
name = "supportflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "uowpoob", email = "li754692@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "asyncmy>=0.2.10",
    "sqlalchemy[asyncio]>=2.0.53",
    "uvicorn>=0.52.4",
    "alembic>=1.20.0",
    "jinja2>=3.1.6",
    "bcrypt>=5.0.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
    "passlib>=1.7.4",
    "cryptography>=50.0.1",
    "langchain-core>=1.6.3",
    "ipython>=9.17.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
    "pymilvus>=3.0.2",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "python-docx>=1.2.0",
]

[project.scripts]
supportflow = "supportflow:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
